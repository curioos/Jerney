apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: external-secrets-platform
  namespace: argocd
spec:
  description: GitOps boundary for External Secrets Operator and Jerney secret sync resources
  sourceRepos:
    - https://charts.external-secrets.io
    - https://github.com/curioos/Jerney.git
  destinations:
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: jerney
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"