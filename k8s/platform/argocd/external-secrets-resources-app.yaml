apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: external-secrets-platform
  source:
    repoURL: https://github.com/curioos/Jerney.git
    targetRevision: devops
    path: k8s/platform/external-secrets
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: jerney
  syncPolicy:
    automated:
      prune: true
      selfHeal: true